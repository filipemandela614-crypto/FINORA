<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101b"><link rel="manifest" href="manifest.json"><title>FINORA — Smart Finance</title><style>:root{--bg:#050a12;--p:#0c1420;--p2:#101c2b;--l:#1e2b3d;--t:#eff6ff;--m:#91a0b5;--g:#67e8b5;--r:#fb7185;--b:#63a4ff;--y:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -15%,#173d5c,transparent 38%),var(--bg);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:235px;position:fixed;height:100vh;background:#080f19;border-right:1px solid var(--l);padding:22px 12px}.logo{font-size:25px;font-weight:900;letter-spacing:4px;margin:5px 12px 25px}.logo span{color:var(--g)}nav button{display:block;width:100%;padding:12px 13px;margin:3px 0;border:0;border-radius:11px;background:transparent;color:var(--m);text-align:left}nav button.active,nav button:hover{background:#112136;color:#fff}.main{margin-left:235px;width:calc(100% - 235px);max-width:1450px;padding:25px}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0 0 4px;font-size:27px}.muted{color:var(--m)}.btn{background:var(--p2);border:1px solid var(--l);color:#fff;border-radius:10px;padding:10px 13px;font-weight:650}.primary{background:var(--g);color:#052017;border:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(145deg,var(--p),#09111c);border:1px solid var(--l);border-radius:17px;padding:16px}.v{font-size:24px;font-weight:850;margin:7px 0}.green{color:var(--g)}.red{color:var(--r)}.yellow{color:var(--y)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:13px;margin-top:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar{height:8px;background:#182536;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--b))}.goal{padding:12px 0;border-bottom:1px solid var(--l)}.goal:last-child{border:0}.toolbar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.input,select,textarea{width:100%;background:#07101a;color:#fff;border:1px solid var(--l);border-radius:10px;padding:10px}.toolbar>*{flex:1;min-width:130px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--l);text-align:left}.table th{color:var(--m);font-size:11px;text-transform:uppercase}.scroll{overflow:auto}.tag{background:#14243a;color:#b6d4f8;border-radius:20px;padding:4px 8px;font-size:11px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.on{display:flex}.dialog{background:#0c1624;border:1px solid var(--l);border-radius:20px;padding:20px;width:min(700px,100%);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:4px}.full{grid-column:1/-1}.end{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.score{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--g) 0 78%,#182536 78%);display:grid;place-items:center;margin:auto}.score b{width:95px;height:95px;border-radius:50%;background:#0b1420;display:grid;place-items:center;font-size:28px}.mobile{display:none}@media(max-width:850px){.side{display:none}.main{margin:0;width:100%;padding:17px 13px 82px}.cards{grid-template-columns:1fr 1fr}.grid,.grid3{grid-template-columns:1fr}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#09121ded;backdrop-filter:blur(14px);border-top:1px solid var(--l);z-index:4}.mobile button{flex:1;text-align:center;font-size:10px;padding:10px 2px}.top h1{font-size:21px}.form{grid-template-columns:1fr}.full{grid-column:auto}.actions .secondary{display:none}}</style></head><body><div class="app"><aside class="side"><div class="logo">FIN<span>ORA</span></div><nav id="nav"></nav></aside><main class="main"><div class="top"><div><h1 id="title">FINORA</h1><div class="muted" id="sub">A tua visão financeira.</div></div><button class="btn primary" id="quick">＋ Movimento</button></div><div id="pages"></div></main><div class="mobile" id="mobile"></div></div><div class="modal" id="modal"><div class="dialog"><div class="row"><h2 id="mt">Novo</h2><button class="btn" onclick="closeM()">✕</button></div><div id="mf"></div></div></div><script>
const K='finora_db';let d=JSON.parse(localStorage.getItem(K)||'null')||{p:{name:'Mandela',age:0,income:850000,proj:850000,extra:0,pextra:0,save:30,risk:'Moderado'},e:[],g:[{id:id(),name:'Fundo de emergência',target:3000000,saved:0,deadline:'',priority:'Alta'}],b:[],i:[],r:[]};function id(){return crypto.randomUUID()}function save(){localStorage.setItem(K,JSON.stringify(d));render()}function money(n){return new Intl.NumberFormat('pt-AO').format(Math.round(n))+' Kz'}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function st(){let m=new Date().toISOString().slice(0,7),e=d.e.filter(x=>x.date.startsWith(m)),ex=e.reduce((a,x)=>a+x.v,0),inc=d.p.income+d.p.extra,proj=d.p.proj+d.p.pextra,inv=d.i.reduce((a,x)=>a+x.cur,0),go=d.g.reduce((a,x)=>a+x.saved,0);return{e,ex,inc,proj,inv,go,bal:inc-ex,rate:inc?Math.max(0,(inc-ex)/inc*100):0,net:inc-ex+inv+go}}function page(name,label,body){return `<section class="page" id="${name}">${body}</section>`}function render(){let S=st();let pages={dashboard:page('dashboard','Dashboard',`<div class="cards"><div class="card"><span class="muted">Património estimado</span><div class="v">${money(S.net)}</div></div><div class="card"><span class="muted">Rendimento mensal</span><div class="v">${money(S.inc)}</div></div><div class="card"><span class="muted">Despesas este mês</span><div class="v red">${money(S.ex)}</div></div><div class="card"><span class="muted">Taxa de poupança</span><div class="v green">${S.rate.toFixed(1)}%</div></div></div><div class="grid"><div class="card"><h2>🎯 Objectivos</h2>${d.g.slice(0,4).map(g=>{let p=g.target?Math.min(100,g.saved/g.target*100):0;return `<div class="goal"><div class="row"><b>${esc(g.name)}</b><span>${p.toFixed(0)}%</span></div><div class="bar"><i style="width:${p}%"></i></div><small class="muted">${money(g.saved)} / ${money(g.target)}</small></div>`}).join('')||'<p class="muted">Cria uma meta.</p>'}</div><div class="card"><h2>🧠 Saúde</h2><div class="score"><b>${Math.round(Math.min(100,50+S.rate*.7+(d.g.length?10:0)+(d.i.length?8:0)))}</b></div><p class="muted">${S.rate>=d.p.save?'Estás a cumprir a tua meta de poupança.':'A tua poupança está abaixo da meta definida.'}</p></div></div><div class="grid"><div class="card"><h2>📊 Resumo</h2><p>Saldo disponível: <b>${money(S.bal)}</b></p><p>Meta mensal de poupança: <b>${money(S.inc*d.p.save/100)}</b></p><p>Perfil de risco: <b>${d.p.risk}</b></p></div><div class="card"><h2>🤖 Insight</h2><p class="muted">${S.ex?`Gastaste ${money(S.ex)} este mês. A margem actual é ${money(S.bal)}.`:'Regista as tuas despesas para começar a análise.'}</p></div></div>`),expenses:page('expenses','Despesas',`<div class="card"><div class="row"><h2>💸 Despesas</h2><button class="btn primary" onclick="expense()">＋ Nova</button></div><div class="toolbar"><input class="input" id="es" placeholder="🔎 Nome..."><select id="ec"><option value="">Todas</option><option>Alimentação</option><option>Casa</option><option>Transporte</option><option>Saúde</option><option>Educação</option><option>Lazer</option><option>Família</option><option>Serviços</option><option>Compras</option><option>Investimento</option><option>Outros</option></select><input class="input" id="em" type="month"></div><div class="scroll"><table class="table"><thead><tr><th>Data</th><th>Nome</th><th>Categoria</th><th>Pagamento</th><th>Valor</th><th></th></tr></thead><tbody id="er"></tbody></table></div></div>`),budget:page('budget','Orçamento',`<div class="cards"><div class="card"><span class="muted">Receita projectada</span><div class="v">${money(S.proj)}</div></div><div class="card"><span class="muted">Receita real</span><div class="v">${money(S.inc)}</div></div><div class="card"><span class="muted">Despesas projectadas</span><div class="v">${money(d.b.reduce((a,x)=>a+x.p,0))}</div></div><div class="card"><span class="muted">Despesas reais</span><div class="v red">${money(S.ex)}</div></div></div><div class="card" style="margin-top:13px"><div class="row"><h2>📐 Orçamento mensal</h2><button class="btn primary" onclick="budget()">＋ Categoria</button></div><div class="scroll"><table class="table"><thead><tr><th>Categoria</th><th>Projectado</th><th>Real</th><th>Diferença</th></tr></thead><tbody>${d.b.map(x=>{let r=S.e.filter(e=>e.cat===x.c).reduce((a,e)=>a+e.v,0);return `<tr><td>${esc(x.c)}</td><td>${money(x.p)}</td><td>${money(r)}</td><td class="${x.p-r>=0?'green':'red'}">${money(x.p-r)}</td></tr>`}).join('')||'<tr><td colspan="4" class="muted">Adiciona categorias ao orçamento.</td></tr>'}</tbody></table></div></div>`),goals:page('goals','Objectivos',`<div class="card"><div class="row"><h2>🎯 Objectivos</h2><button class="btn primary" onclick="goal()">＋ Novo</button></div>${d.g.map(g=>{let p=g.target?Math.min(100,g.saved/g.target*100):0,need=g.deadline?Math.max(0,(g.target-g.saved)/Math.max(1,(new Date(g.deadline+'-01')-new Date())/2592000000)):0;return `<div class="goal"><div class="row"><b>${esc(g.name)}</b><span>${money(g.saved)} / ${money(g.target)}</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="row"><small class="muted">${p.toFixed(0)}% · ${g.priority}</small><small>${g.deadline?money(need)+'/mês':''}</small></div><p><button class="btn" onclick="contrib('${g.id}')">＋ Poupança</button> <button class="btn danger" onclick="delg('${g.id}')">Apagar</button></p></div>`}).join('')}</div>`),savings:page('savings','Poupança',`<div class="grid3"><div class="card"><span class="muted">Disponível</span><div class="v">${money(S.bal)}</div></div><div class="card"><span class="muted">Meta mensal</span><div class="v">${money(S.inc*d.p.save/100)}</div></div><div class="card"><span class="muted">Fundo emergência</span><div class="v">${money(d.g.find(g=>g.name.toLowerCase().includes('emerg'))?.saved||0)}</div></div></div><div class="card" style="margin-top:13px"><h2>💰 Regra sugerida</h2><p>Meta de poupança: <b>${d.p.save}%</b> = <b>${money(S.inc*d.p.save/100)}</b>/mês.</p><div class="bar"><i style="width:${Math.min(100,d.p.save)}%"></i></div><p class="muted">Aumenta a meta gradualmente quando o orçamento permitir.</p></div>`),invest:page('invest','Investimentos',`<div class="grid3"><div class="card"><h3>Conservador</h3><p class="muted">Preservação e liquidez.</p></div><div class="card"><h3>Moderado</h3><p class="muted">Equilíbrio risco/retorno.</p></div><div class="card"><h3>Agressivo</h3><p class="muted">Maior volatilidade.</p></div></div><div class="card" style="margin-top:13px"><div class="row"><h2>📈 Carteira</h2><button class="btn primary" onclick="invest()">＋ Investimento</button></div><div class="scroll"><table class="table"><thead><tr><th>Activo</th><th>Tipo</th><th>Capital</th><th>Actual</th><th>Resultado</th></tr></thead><tbody>${d.i.map(x=>`<tr><td>${esc(x.a)}</td><td>${x.t}</td><td>${money(x.c)}</td><td>${money(x.cur)}</td><td class="${x.cur>=x.c?'green':'red'}">${money(x.cur-x.c)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nenhum investimento.</td></tr>'}</tbody></table></div></div>`),ai:page('ai','FINORA AI',`<div class="card"><h2>✦ Assistente financeiro</h2><p class="muted">Pergunta sobre os teus próprios dados.</p><div class="toolbar"><input class="input" id="q" placeholder="Ex.: Quanto posso poupar este mês?"><button class="btn primary" onclick="ask()">Perguntar</button></div><div class="card" id="ans">Aguardando pergunta.</div></div><div class="grid3"><div class="card"><h3>💡 Dica</h3><p>${S.rate<d.p.save?'Tenta reduzir despesas variáveis para atingir a tua meta.':'Estás dentro da meta de poupança.'}</p></div><div class="card"><h3>⚠️ Alerta</h3><p>${S.ex>S.inc*.7?'Despesas acima de 70% do rendimento.':'Despesas dentro de uma margem controlada.'}</p></div><div class="card"><h3>🎯 Próximo passo</h3><p>${d.g[0]?'Contribui para '+esc(d.g[0].name)+'.':'Cria um objectivo financeiro.'}</p></div></div>`),profile:page('profile','Perfil',`<div class="card"><h2>👤 Perfil financeiro</h2><div class="form"><div class="field"><label>Nome</label><input class="input" id="pn" value="${esc(d.p.name)}"></div><div class="field"><label>Idade</label><input class="input" id="pa" type="number" value="${d.p.age}"></div><div class="field"><label>Rendimento real</label><input class="input" id="pi" type="number" value="${d.p.income}"></div><div class="field"><label>Rendimento projectado</label><input class="input" id="pp" type="number" value="${d.p.proj}"></div><div class="field"><label>Rendimento extra real</label><input class="input" id="px" type="number" value="${d.p.extra}"></div><div class="field"><label>Rendimento extra projectado</label><input class="input" id="pe" type="number" value="${d.p.pextra}"></div><div class="field"><label>Meta de poupança %</label><input class="input" id="ps" type="number" value="${d.p.save}"></div><div class="field"><label>Perfil de risco</label><select id="pr"><option ${d.p.risk==='Conservador'?'selected':''}>Conservador</option><option ${d.p.risk==='Moderado'?'selected':''}>Moderado</option><option ${d.p.risk==='Agressivo'?'selected':''}>Agressivo</option></select></div><div class="end"><button class="btn primary" onclick="profileSave()">Guardar</button></div></div></div>`)};document.getElementById('pages').innerHTML=Object.values(pages).join('');let names={dashboard:'Dashboard',expenses:'Despesas',budget:'Orçamento',goals:'Objectivos',savings:'Poupança',invest:'Investimentos',ai:'FINORA AI',profile:'Perfil'};document.getElementById('nav').innerHTML=Object.keys(names).map(k=>`<button data-p="${k}" onclick="go('${k}')">${{dashboard:'⌂',expenses:'↕',budget:'▤',goals:'◎',savings:'▣',invest:'↗',ai:'✦',profile:'♙'}[k]} &nbsp; ${names[k]}</button>`).join('');document.getElementById('mobile').innerHTML=Object.keys(names).slice(0,5).map(k=>`<button onclick="go('${k}')">${names[k]}</button>`).join('');go('dashboard');renderExpenses()}function go(k){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(k).classList.add('active');document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===k));document.getElementById('title').textContent={dashboard:'Olá, '+(d.p.name||'Utilizador')+' 👋',expenses:'Despesas',budget:'Orçamento',goals:'Objectivos',savings:'Poupança',invest:'Investimentos',ai:'FINORA AI',profile:'Perfil'}[k];document.getElementById('sub').textContent={dashboard:'A tua visão financeira, num só lugar.',expenses:'Cada despesa pode ser detalhada.',budget:'Planeia e compara o projectado com o real.',goals:'Transforma planos em metas.',savings:'Constrói reservas.',invest:'Acompanha a tua carteira.',ai:'O teu assistente financeiro.',profile:'Personaliza a tua estratégia.'}[k];if(k==='expenses')renderExpenses()}function openM(t,html,fn){document.getElementById('mt').textContent=t;document.getElementById('mf').innerHTML=html+`<div class="end"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" id="ok">Guardar</button></div>`;document.getElementById('modal').classList.add('on');document.getElementById('ok').onclick=fn}function closeM(){document.getElementById('modal').classList.remove('on')}function expense(){openM('Nova despesa',`<div class="field full"><label>Nome</label><input class="input" id="n"></div><div class="field"><label>Valor (Kz)</label><input class="input" id="v" type="number"></div><div class="field"><label>Data</label><input class="input" id="dt" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Categoria</label><select id="c"><option>Alimentação</option><option>Casa</option><option>Transporte</option><option>Saúde</option><option>Educação</option><option>Lazer</option><option>Família</option><option>Serviços</option><option>Compras</option><option>Investimento</option><option>Outros</option></select></div><div class="field"><label>Subcategoria</label><input class="input" id="s"></div><div class="field"><label>Pagamento</label><select id="pay"><option>Multicaixa</option><option>Dinheiro</option><option>Visa</option><option>Transferência</option><option>Débito</option><option>Outro</option></select></div><div class="field"><label>Local</label><input class="input" id="pl"></div><div class="field"><label>Prioridade</label><select id="pr"><option>Essencial</option><option>Importante</option><option>Não essencial</option></select></div><div class="field"><label>Recorrência</label><select id="re"><option>Única</option><option>Semanal</option><option>Mensal</option><option>Anual</option></select></div><div class="field"><label>Próximo vencimento</label><input class="input" id="nx" type="date"></div><div class="field full"><label>Descrição</label><textarea id="de"></textarea></div><div class="field full"><label><input id="fx" type="checkbox"> Despesa fixa</label></div>`,()=>{if(!n.value||!v.value)return alert('Preenche nome e valor.');d.e.push({id:id(),name:n.value,v:+v.value,date:dt.value,cat:c.value,sub:s.value,payment:pay.value,place:pl.value,priority:pr.value,rec:re.value,next:nx.value,desc:de.value,fixed:fx.checked});closeM();save()})}function renderExpenses(){let es=document.getElementById('er');if(!es)return;let q=(document.getElementById('es')?.value||'').toLowerCase(),c=document.getElementById('ec')?.value||'',m=document.getElementById('em')?.value||'';let a=d.e.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!c||x.cat===c)&&(!m||x.date.startsWith(m)));es.innerHTML=a.sort((x,y)=>y.date.localeCompare(x.date)).map(x=>`<tr><td>${x.date}</td><td><b>${esc(x.name)}</b><br><small class="muted">${esc(x.sub)}</small></td><td><span class="tag">${x.cat}</span></td><td>${x.payment}</td><td class="red">${money(x.v)}</td><td><button class="btn danger" onclick="dele('${x.id}')">Apagar</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nenhuma despesa.</td></tr>';['es','ec','em'].forEach(x=>document.getElementById(x)?.addEventListener('input',renderExpenses))}function dele(i){if(confirm('Apagar despesa?')){d.e=d.e.filter(x=>x.id!==i);save()}}function goal(){openM('Novo objectivo',`<div class="field full"><label>Nome</label><input class="input" id="gn"></div><div class="field"><label>Valor alvo</label><input class="input" id="gt" type="number"></div><div class="field"><label>Já poupado</label><input class="input" id="gs" type="number" value="0"></div><div class="field"><label>Prazo</label><input class="input" id="gd" type="month"></div><div class="field"><label>Prioridade</label><select id="gp"><option>Alta</option><option>Média</option><option>Baixa</option></select></div>`,()=>{if(!gn.value||!gt.value)return alert('Preenche nome e alvo.');d.g.push({id:id(),name:gn.value,target:+gt.value,saved:+gs.value,deadline:gd.value,priority:gp.value});closeM();save()})}function contrib(i){let g=d.g.find(x=>x.id===i),v=+prompt('Valor da contribuição (Kz):');if(v>0){g.saved+=v;save()}}function delg(i){if(confirm('Apagar objectivo?')){d.g=d.g.filter(x=>x.id!==i);save()}}function budget(){openM('Categoria de orçamento',`<div class="field"><label>Categoria</label><select id="bc"><option>Moradia</option><option>Transporte</option><option>Alimentação</option><option>Entretenimento</option><option>Empréstimos</option><option>Impostos</option><option>Seguros</option><option>Economias / Investimentos</option><option>Educação</option><option>Outros</option></select></div><div class="field"><label>Projectado (Kz)</label><input class="input" id="bp" type="number"></div>`,()=>{d.b=d.b.filter(x=>x.c!==bc.value);d.b.push({c:bc.value,p:+bp.value||0});closeM();save()})}function invest(){openM('Novo investimento',`<div class="field"><label>Activo</label><input class="input" id="ia"></div><div class="field"><label>Tipo</label><select id="it"><option>Obrigações</option><option>Acções</option><option>ETF</option><option>Depósito</option><option>Imobiliário</option><option>Outro</option></select></div><div class="field"><label>Capital</label><input class="input" id="ic" type="number"></div><div class="field"><label>Valor actual</label><input class="input" id="iv" type="number"></div>`,()=>{d.i.push({id:id(),a:ia.value,t:it.value,c:+ic.value,cur:+iv.value});closeM();save()})}function ask(){let q=document.getElementById('q').value.toLowerCase(),S=st(),a=q.includes('poupar')?`Tens ${money(S.inc)} de rendimento, ${money(S.ex)} de despesas e ${money(S.bal)} de margem este mês. A taxa de poupança é ${S.rate.toFixed(1)}%.`:q.includes('invest')?`A tua margem actual é ${money(S.bal)}. Mantém uma reserva de emergência e considera o perfil ${d.p.risk.toLowerCase()}.`:q.includes('despesa')||q.includes('gasto')?`As despesas deste mês totalizam ${money(S.ex)}.`:`O teu rendimento é ${money(S.inc)}, as despesas ${money(S.ex)} e o saldo ${money(S.bal)}.`;document.getElementById('ans').textContent=a}function profileSave(){Object.assign(d.p,{name:pn.value||'Utilizador',age:+pa.value||0,income:+pi.value||0,proj:+pp.value||0,extra:+px.value||0,pextra:+pe.value||0,save:+ps.value||30,risk:pr.value});save();alert('Perfil guardado.')}document.getElementById('quick').onclick=expense;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
