name: Build FINORA iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run build:web

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify generated iOS project
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -version

      - name: Build iOS project without signing
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/FINORA-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package iOS application
        run: |
          APP_PATH="$RUNNER_TEMP/FINORA-derived/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/FINORA-iOS-unsigned.zip"

      - name: Upload FINORA iOS build
        uses: actions/upload-artifact@v4
        with:
          name: FINORA-iOS-unsigned
          path: ${{ runner.temp }}/FINORA-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 30
